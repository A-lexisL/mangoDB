# Keep linting independent of configuration files outside this repository.
set noparent
# The supplied clang-format file owns indentation. The course starter files
# retain their original authorship; do not invent copyright notices for them.
# Existing query/builder interfaces intentionally use mutable references.
# Retain those C++ interfaces instead of rewriting them for the older Google
# pointer-only style rule shipped by cpplint 2.0.0 on lemonion.
# Include ordering follows the supplied clang-format file, not Google's style.
filter=-whitespace/indent,-legal/copyright,-runtime/references,-build/include_order
